name: CD

on:
  push:
    branches: [main]

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: ./go.mod

      - name: Set up post processors
        run: |
          mkdir -p ./bin/

          curl -vLo ./bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.1/tailwindcss-linux-x64
          curl -vLo ./bin/minhtml https://github.com/wilsonzlin/minify-html/releases/download/v0.18.1/minhtml-0.18.1-x86_64-unknown-linux-gnu

          chmod -v +x ./bin/tailwindcss ./bin/minhtml

      - name: Generate static files
        run: env PATH="./bin/:$PATH" go run ./cmd

      - name: Upload static files as artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public/
          include-hidden-files: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: generate

    # grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
